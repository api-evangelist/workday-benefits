description: >-
  Workday publishes no plans, tiers or prices for its API surface, and no public pricing page for the product
  either - https://www.workday.com/en-us/pricing.html returns 404 and the site routes buyers to a sales
  contact. API access is not sold separately: the Benefits REST and SOAP services are included with a Workday
  HCM subscription and are enabled per tenant by registering an API client and granting security domains, so
  there is no self-serve plan for an agent or developer to buy. Workday Extend Professional (the packaging
  that carries the Agent-Ready MCP tools early access) is likewise a negotiated add-on with no listed price.
