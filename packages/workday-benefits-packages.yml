summary:
  official_api_sdk_count: 0
  note: >-
    Workday publishes NO first-party SDK for its REST or SOAP APIs. The only first-party Workday packages in
    a public registry are the Canvas design-system libraries (UI components for building Workday Extend apps),
    which do not wrap this API surface; they are recorded here for accuracy and are also described in
    components/. Because no package wraps the API, this repo deliberately carries NO `SDKs` pointer in
    apis.yml - emitting one would credit Workday with client libraries it does not ship. The first-party
    tooling that does exist is a CLI (WDCLI, see cli/) distributed from the Workday Developer Site behind
    developer credentials rather than from a public registry.
