naftiko: "1.0.0-alpha1"

info:
  label: "Workday Benefits API"
  description: "Shared capability definition for Workday Benefits API operations covering benefit plans, enrollments, dependents, qualifying life events, time off plans, and employee benefits summaries."
  tags:
    - Benefits
    - Employee Benefits
    - Enterprise
    - HCM
    - HR
    - Workday
  created: "2026-05-03"
  modified: "2026-05-03"

binds:
  - namespace: env
    keys:
      WORKDAY_CLIENT_ID: WORKDAY_CLIENT_ID
      WORKDAY_CLIENT_SECRET: WORKDAY_CLIENT_SECRET
      WORKDAY_TENANT: WORKDAY_TENANT

capability:
  consumes:
    - openapi: workday-benefits
      location: ../../openapi/workday-benefits-openapi.yml

  exposes:
    - type: rest
      port: 8100
      namespace: workday-benefits-api
      description: "REST API for Workday Benefits operations."
      resources:
        - path: /v1/benefit-plans
          name: benefit-plans
          description: "Benefit plans management"
          operations:
            - method: GET
              name: list-benefit-plans
              description: "List benefit plans"
              call: "workday-benefits.listBenefitPlans"
              outputParameters:
                - type: object
                  mapping: "$."
        - path: /v1/benefit-plans/{planId}
          name: benefit-plan-by-id
          description: "Single benefit plan"
          operations:
            - method: GET
              name: get-benefit-plan
              description: "Get a benefit plan"
              call: "workday-benefits.getBenefitPlan"
              with:
                planId: "rest.planId"
              outputParameters:
                - type: object
                  mapping: "$."
        - path: /v1/benefit-enrollments
          name: benefit-enrollments
          description: "Benefit enrollments management"
          operations:
            - method: GET
              name: list-benefit-enrollments
              description: "List benefit enrollments"
              call: "workday-benefits.listBenefitEnrollments"
              outputParameters:
                - type: object
                  mapping: "$."
            - method: POST
              name: create-benefit-enrollment
              description: "Create a benefit enrollment"
              call: "workday-benefits.createBenefitEnrollment"
              outputParameters:
                - type: object
                  mapping: "$."
        - path: /v1/benefit-enrollments/{enrollmentId}
          name: benefit-enrollment-by-id
          description: "Single benefit enrollment"
          operations:
            - method: GET
              name: get-benefit-enrollment
              description: "Get a benefit enrollment"
              call: "workday-benefits.getBenefitEnrollment"
              with:
                enrollmentId: "rest.enrollmentId"
              outputParameters:
                - type: object
                  mapping: "$."
        - path: /v1/dependents
          name: dependents
          description: "Dependents management"
          operations:
            - method: GET
              name: list-dependents
              description: "List dependents"
              call: "workday-benefits.listDependents"
              outputParameters:
                - type: object
                  mapping: "$."
            - method: POST
              name: create-dependent
              description: "Add a dependent"
              call: "workday-benefits.createDependent"
              outputParameters:
                - type: object
                  mapping: "$."
        - path: /v1/benefit-events
          name: benefit-events
          description: "Benefit events management"
          operations:
            - method: GET
              name: list-benefit-events
              description: "List benefit events"
              call: "workday-benefits.listBenefitEvents"
              outputParameters:
                - type: object
                  mapping: "$."
        - path: /v1/time-off-plans
          name: time-off-plans
          description: "Time off plans management"
          operations:
            - method: GET
              name: list-time-off-plans
              description: "List time off plans"
              call: "workday-benefits.listTimeOffPlans"
              outputParameters:
                - type: object
                  mapping: "$."
        - path: /v1/employees/{employeeId}/benefits
          name: employee-benefits
          description: "Employee benefits summary"
          operations:
            - method: GET
              name: get-employee-benefits
              description: "Get employee benefits summary"
              call: "workday-benefits.getEmployeeBenefits"
              with:
                employeeId: "rest.employeeId"
              outputParameters:
                - type: object
                  mapping: "$."

    - type: mcp
      port: 9100
      namespace: workday-benefits-mcp
      transport: http
      description: "MCP server for Workday Benefits API operations."
      tools:
        - name: list-benefit-plans
          description: "List Workday benefit plans with optional filtering by type"
          hints:
            readOnly: true
            openWorld: true
          call: "workday-benefits.listBenefitPlans"
          outputParameters:
            - type: object
              mapping: "$."
        - name: get-benefit-plan
          description: "Get a specific Workday benefit plan by ID"
          hints:
            readOnly: true
          call: "workday-benefits.getBenefitPlan"
          with:
            planId: "tools.planId"
          outputParameters:
            - type: object
              mapping: "$."
        - name: list-benefit-enrollments
          description: "List Workday benefit enrollments with optional filtering"
          hints:
            readOnly: true
          call: "workday-benefits.listBenefitEnrollments"
          outputParameters:
            - type: object
              mapping: "$."
        - name: create-benefit-enrollment
          description: "Create a new Workday benefit enrollment"
          hints:
            readOnly: false
          call: "workday-benefits.createBenefitEnrollment"
          outputParameters:
            - type: object
              mapping: "$."
        - name: list-dependents
          description: "List Workday employee dependents"
          hints:
            readOnly: true
          call: "workday-benefits.listDependents"
          outputParameters:
            - type: object
              mapping: "$."
        - name: create-dependent
          description: "Add a new Workday employee dependent"
          hints:
            readOnly: false
          call: "workday-benefits.createDependent"
          outputParameters:
            - type: object
              mapping: "$."
        - name: list-benefit-events
          description: "List Workday benefit qualifying life events"
          hints:
            readOnly: true
          call: "workday-benefits.listBenefitEvents"
          outputParameters:
            - type: object
              mapping: "$."
        - name: list-time-off-plans
          description: "List Workday time off and leave plans"
          hints:
            readOnly: true
          call: "workday-benefits.listTimeOffPlans"
          outputParameters:
            - type: object
              mapping: "$."
        - name: get-employee-benefits
          description: "Get an employee's complete benefits summary including all active enrollments"
          hints:
            readOnly: true
          call: "workday-benefits.getEmployeeBenefits"
          with:
            employeeId: "tools.employeeId"
          outputParameters:
            - type: object
              mapping: "$."
