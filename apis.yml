aid: workday-benefits
name: Workday Benefits
description: 'Workday Benefits covers the benefits administration surface of Workday Human Capital Management: benefit
  plan definitions, enrollment events and offerings, employee elections, dependents and beneficiaries, retirement
  savings plans, ACA reporting data, rates and benefit providers. Workday publishes machine-readable contracts for
  this surface in two shapes - production REST services (benefitEnrollmentEventOfferings v1 and benefitPartner v1,
  OpenAPI 3.0.1 in the Workday REST API Explorer directory) and the Benefits_Administration Workday Web Service,
  a 47-operation SOAP contract published as a public WSDL at version v47.0. Access is tenant-scoped and OAuth 2.0
  only; there is no public sandbox and no public pricing for the API surface.'
deliveryModel:
  model: saas
  open_source: false
  commercial: true
  callable_host: true
  label: Hosted service · you call their endpoint
  confidence: high
  source:
  - openapi
  - pricing
  generated: '2026-08-28'
  method: derived
accessModel:
  pricing: freemium
  onboarding: self-serve
  trial: false
  try_now: true
  public: false
  label: Freemium · Self-serve signup
  confidence: high
  source:
  - plans
  - authentication
  generated: '2026-07-22'
  method: derived
